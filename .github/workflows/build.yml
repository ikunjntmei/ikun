name: Build Debian 12 DD Image

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: '设置 root 初始密码'
        required: true
        default: 'abc123456'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 构建 Debian 12 DD 镜像
        run: |
          set -e
          IMAGE_NAME="debian12-amd64.img"
          ROOT_PASS="${{ github.event.inputs.root_password }}"
          TARGET_DIR="/mnt/target"

          echo "=== 1. 安装构建依赖及 Debian GPG 证书 ==="
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap debian-archive-keyring parted dosfstools e2fsprogs xz-utils kpartx grub-pc-bin grub-efi-amd64-bin curl

          echo "=== 2. 创建 2.5GB 虚拟磁盘并规划 UEFI+BIOS 分区 ==="
          dd if=/dev/zero of=${IMAGE_NAME} bs=1M count=2560
          LOOP_DEV=$(sudo losetup -Pf --show ${IMAGE_NAME})

          sudo parted -s "$LOOP_DEV" mklabel gpt
          sudo parted -s "$LOOP_DEV" mkpart bios 1MiB 3MiB
          sudo parted -s "$LOOP_DEV" set 1 bios_grub on
          sudo parted -s "$LOOP_DEV" mkpart efi fat32 3MiB 203MiB
          sudo parted -s "$LOOP_DEV" set 2 boot on
          sudo parted -s "$LOOP_DEV" set 2 esp on
          sudo parted -s "$LOOP_DEV" mkpart root ext4 203MiB 100%

          sudo mkfs.fat -F32 "${LOOP_DEV}p2"
          sudo mkfs.ext4 -F -L "ROOTFS" "${LOOP_DEV}p3"

          sudo mkdir -p ${TARGET_DIR}
          sudo mount "${LOOP_DEV}p3" ${TARGET_DIR}
          sudo mkdir -p ${TARGET_DIR}/boot/efi
          sudo mount "${LOOP_DEV}p2" ${TARGET_DIR}/boot/efi

          echo "=== 3. 部署 Debian 12 基础系统 ==="
          sudo debootstrap --arch=amd64 bookworm ${TARGET_DIR} https://deb.debian.org/debian/

          for d in /dev /dev/pts /proc /sys /run; do
            sudo mount --bind "$d" "${TARGET_DIR}$d"
          done

          echo "=== 4. 进入 chroot 配置系统 ==="
          sudo chroot ${TARGET_DIR} /bin/bash << EOF
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export DEBCONF_NONINTERACTIVE_SEEN=true

          cat << 'SOURCES' > /etc/apt/sources.list
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          SOURCES

          apt-get update -y
          # 注意：systemd-networkd 已内建在 systemd，此处仅安装 systemd-resolved
          apt-get install -y --no-install-recommends \
            linux-image-cloud-amd64 grub-pc grub-efi-amd64 openssh-server \
            systemd-resolved cloud-guest-utils curl

          # 注入关键驱动模块
          cat << 'MODULES' >> /etc/initramfs-tools/modules
          nvme
          xen-blkfront
          virtio_blk
          virtio_net
          ena
          MODULES
          update-initramfs -u -k all

          # 配置 Root 密码及放行 SSH 密码登录
          echo "root:${ROOT_PASS}" | chpasswd
          sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config

          # 全网卡自动 DHCP 联网配置并启用服务
          cat << 'NET' > /etc/systemd/network/10-dhcp.network
          [Match]
          Name=en* eth*

          [Network]
          DHCP=yes
          NET
          systemctl enable systemd-networkd
          systemctl enable systemd-resolved

          # 挂载表
          cat << 'FSTAB' > /etc/fstab
          LABEL=ROOTFS    /           ext4    defaults,noatime    0 1
          FSTAB
          EFI_UUID=\$(blkid -s UUID -o value \$(df --output=source /boot/efi | tail -1))
          echo "UUID=\$EFI_UUID  /boot/efi  vfat  defaults,nofail  0 2" >> /etc/fstab

          # GRUB 串口控制台配置
          cat << 'GRUB' > /etc/default/grub
          GRUB_DEFAULT=0
          GRUB_TIMEOUT=3
          GRUB_DISTRIBUTOR="Debian"
          GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 console=ttyS0,115200 earlyprintk=ttyS0,115200 rootdelay=10"
          GRUB_TERMINAL="console serial"
          GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"
          GRUB

          # 写入 Legacy BIOS 与 UEFI 双模引导
          grub-install --target=i386-pc --recheck ${LOOP_DEV}
          grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=debian --recheck --no-nvram
          mkdir -p /boot/efi/EFI/boot
          cp /boot/efi/EFI/debian/grubx64.efi /boot/efi/EFI/boot/bootx64.efi
          update-grub

          # 开机自动扩容根磁盘服务
          cat << 'EXPAND' > /etc/systemd/system/expand-root.service
          [Unit]
          Description=Expand root partition on first boot
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c "DISK=\\\$(findmnt -n -o SOURCE / | sed -r 's/p?[0-9]+\\\$//'); PART=\\\$(findmnt -n -o SOURCE / | grep -o '[0-9]*\\\$'); growpart \\\$DISK \\\$PART || true; resize2fs /dev/disk/by-label/ROOTFS || true"
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EXPAND
          systemctl enable expand-root.service
          EOF

          echo "=== 5. 卸载虚拟文件系统与打包压缩 ==="
          sudo umount ${TARGET_DIR}/boot/efi
          for d in run sys proc dev/pts dev; do
            sudo umount ${TARGET_DIR}/$d
          done
          sudo umount ${TARGET_DIR}
          sudo losetup -d "$LOOP_DEV"

          xz -z -9 -T0 "${IMAGE_NAME}"

      - name: 发布镜像至 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: debian12-${{ github.run_id }}
          name: Debian 12 DD Image (Release ${{ github.run_id }})
          body: |
            ### 镜像构建信息
            - 系统版本：Debian 12 (Bookworm)
            - 启动模式：UEFI + BIOS 双模
            - 适配硬件：AWS ENA / NVMe / KVM VirtIO
            - 登录用户名：`root`
            - 初始密码：`${{ github.event.inputs.root_password }}`
          files: debian12-amd64.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
